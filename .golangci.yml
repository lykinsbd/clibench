version: "2"
linters:
  enable:
    - gocritic
    - gosec
    - prealloc
  settings:
    errcheck:
      exclude-functions:
        # SSH protocol acks — no meaningful recovery
        - (*golang.org/x/crypto/ssh.Request).Reply
        - (golang.org/x/crypto/ssh.NewChannel).Reject
        - (golang.org/x/crypto/ssh.Channel).SendRequest
        - (golang.org/x/crypto/ssh.Channel).Write
        # Writing to streams in session handlers
        - io.WriteString
        # Best-effort teardown — qdisc may already be removed
        - github.com/vishvananda/netlink.QdiscDel
    gosec:
      excludes:
        # We intentionally use InsecureSkipVerify (self-signed certs in benchmarks)
        - G402
        # We intentionally use InsecureIgnoreHostKey (benchmark SSH clients)
        - G106
        # Test file permissions are fine at 0644
        - G306
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      # Fire-and-forget server goroutines in cmd/ entrypoints
      - linters:
          - errcheck
        source: "go .+\\.(ListenAndServe|ListenAndServeTLS|ListenAndServeH3)\\(\\)"
      # gosec: XSS is not relevant for CLI output (not a web app)
      - linters:
          - gosec
        text: "G705"
      # gosec: Slowloris is acceptable for a local benchmark server
      - linters:
          - gosec
        text: "G112"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
